<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        EduGenie - AI Learning Assistant
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >
</head>

<body>

    <header class="header">

        <div class="header-content">

            <div>
                <h1>EduGenie</h1>

                <p>
                    Google Gemini Powered Learning Assistant
                </p>
            </div>

        </div>

    </header>


    <main class="container">

        <section class="card">

            <h2>Learn with AI</h2>

            <p class="description">
                Ask questions, understand concepts, create quizzes,
                summarize content, or generate a learning path.
            </p>


            <label for="task">
                Select a task
            </label>

            <select id="task">

                <option value="qa">
                    Question & Answer
                </option>

                <option value="explain">
                    Explain a Concept
                </option>

                <option value="quiz">
                    Generate Quiz
                </option>

                <option value="summarize">
                    Summarize Text
                </option>

                <option value="learn">
                    Learning Path
                </option>

            </select>


            <label for="inputText">
                Enter your question or content
            </label>

            <textarea
                id="inputText"
                rows="10"
                placeholder="Example: Explain the Pythagoras theorem..."
            ></textarea>


            <div class="buttons">

                <button
                    id="submitButton"
                    class="primary-button"
                >
                    Generate
                </button>

                <button
                    id="clearButton"
                    class="secondary-button"
                >
                    Clear
                </button>

            </div>

        </section>


        <section
            id="resultSection"
            class="card result-card hidden"
        >

            <div class="result-header">

                <h2>Result</h2>

                <span
                    id="status"
                    class="status"
                >
                    Ready
                </span>

            </div>


            <div id="result"></div>

        </section>

    </main>


    <footer class="footer">

        <p>
            EduGenie • AI-powered learning assistant
        </p>

    </footer>


    <script
        src="{{ url_for('static', path='app.js') }}"
    ></script>

</body>

</html>
